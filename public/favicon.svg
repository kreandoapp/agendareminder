<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Wilbuk calendar logo</title>
  <desc id="desc">Blue and violet calendar with a turquoise check mark.</desc>

  <defs>
    <linearGradient id="calendarGradient" x1="0.05" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#08D5F5"/>
      <stop offset="0.48" stop-color="#087CFF"/>
      <stop offset="1" stop-color="#6718FF"/>
    </linearGradient>

    <linearGradient id="checkGradient" x1="0.2" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#19E8B0"/>
      <stop offset="0.48" stop-color="#0AD0D7"/>
      <stop offset="1" stop-color="#078CF5"/>
    </linearGradient>

    <linearGradient id="cellGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8DCFF"/>
      <stop offset="1" stop-color="#AFCBFA"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#183CFF" flood-opacity="0.22"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1737B8" flood-opacity="0.20"/>
    </filter>

    <filter id="checkShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#007FCF" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Decorative rays -->
  <g fill="#087CFF" opacity="0.95">
    <rect x="389" y="22" width="25" height="92" rx="12.5" transform="rotate(27 401.5 68)"/>
    <rect x="438" y="113" width="25" height="82" rx="12.5" transform="rotate(58 450.5 154)"/>
    <circle cx="429" cy="53" r="3"/>
    <circle cx="459" cy="87" r="2.5"/>
    <circle cx="398" cy="12" r="2"/>
  </g>

  <!-- Calendar body -->
  <g filter="url(#shadow)">
    <rect x="48" y="117" width="393" height="319" rx="76" fill="url(#calendarGradient)"/>
  </g>

  <!-- Calendar top highlight -->
  <path
    d="M48 192C48 151 82 117 123 117H366C407 117 441 151 441 192V208H48Z"
    fill="#087CFF"
    opacity=".20"/>

  <!-- Binding rings -->
  <g filter="url(#softShadow)">
    <rect x="121" y="67" width="57" height="120" rx="28.5" fill="url(#calendarGradient)"/>
    <rect x="290" y="67" width="57" height="120" rx="28.5" fill="url(#calendarGradient)"/>
  </g>

  <!-- White ring openings -->
  <path d="M110 119V158C110 184 128 202 150 202C172 202 190 184 190 158V119"
        fill="none" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M279 119V158C279 184 297 202 319 202C341 202 359 184 359 158V119"
        fill="none" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Calendar sheet -->
  <g filter="url(#softShadow)">
    <rect x="78" y="200" width="299" height="207" rx="38" fill="#FFF"/>
  </g>

  <!-- Calendar cells -->
  <g>
    <rect x="105" y="229" width="66" height="57" rx="14" fill="url(#cellGradient)"/>
    <rect x="190" y="229" width="66" height="57" rx="14" fill="url(#cellGradient)"/>
    <rect x="275" y="229" width="66" height="57" rx="14" fill="url(#cellGradient)"/>

    <rect x="105" y="303" width="66" height="57" rx="14" fill="url(#cellGradient)"/>
    <rect x="190" y="303" width="66" height="57" rx="14" fill="url(#cellGradient)"/>

    <rect x="275" y="303" width="66" height="57" rx="14" fill="url(#calendarGradient)"/>
  </g>

  <!-- Check badge -->
  <g filter="url(#checkShadow)">
    <circle cx="377" cy="369" r="91" fill="#FFF"/>
    <circle cx="377" cy="369" r="77" fill="url(#checkGradient)"/>
  </g>

  <!-- Check mark -->
  <path
    d="M334 368L363 397L421 335"
    fill="none"
    stroke="#FFF"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
